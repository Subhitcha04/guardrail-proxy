services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_DSN: postgresql://postgres:postgres@db:5432/guardrail
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guardrail
    ports:
      - "5432:5432"
    volumes:
      - guardrail_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  guardrail_pg_data:
